
<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>Learning Threads</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
    }

    /* HEADER */
    header {
      padding: 20px 28px;
      background: #111827;
      border-bottom: 1px solid #334155;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 24px;
      font-weight: bold;
      color: #38bdf8;
    }

    .tagline {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 5px;
    }

    /* MAIN PAGE LAYOUT */
    .content {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 24px;
    }

    main {
      flex: 3 1 500px;
      min-width: 0;
    }

    aside {
      flex: 1 1 230px;
      min-width: 0;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
    }

    /* NAVIGATION */
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    nav a {
      display: block;
      padding: 12px 16px;
      border: 1px solid #475569;
      border-radius: 10px;
      color: #e2e8f0;
      background: #1e293b;
      text-decoration: none;
      text-align: center;
      transition: 0.2s ease;
    }

    nav a:hover {
      background: #334155;
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .account-nav {
      margin-bottom: 20px;
    }

    /* SIDEBAR */
    aside h2 {
      margin-top: 0;
      color: #38bdf8;
      font-size: 20px;
    }

    .site-nav ul {
      grid-template-columns: 1fr;
    }

    .site-nav a {
      text-align: left;
      padding: 14px 16px;
    }

    /* VIDEO AREA */
    .vidviewer {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 12px;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 10px;
    }

    #video-container {
      display: grid;
      gap: 16px;
    }

    button {
      display: inline-block;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #0891b2;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0e7490;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 600px) {
      header {
        padding: 18px;
      }

      .content {
        padding: 14px;
        gap: 16px;
      }

      main,
      aside {
        flex-basis: 100%;
      }

      aside {
        padding: 16px;
      }

      .brand {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div>
      <div class="brand">Learning Threads</div>
      <div class="tagline">Learn your way, one video at a time.</div>
    </div>
  </header>

  <div class="content">

    <main>

      <nav class="account-nav" aria-label="Account">
        <ul>
          <li><a href="#" aria-current="page">Home</a></li>
          <li><a href="#">Sign in</a></li>
        </ul>
      </nav>

      <div class="vidviewer">

        <div id="video-container">

          <!-- Video created using JavaScript -->
          <script>
            const iframe = document.createElement("iframe");
            iframe.src = "https://www.youtube.com/embed/RX8RSH1xGQc";
            iframe.width = "560";
            iframe.height = "315";
            iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
            iframe.allowFullscreen = true;
            iframe.title = "YouTube video player";

            document.getElementById("video-container").appendChild(iframe);
          </script>

          <button type="button">Link next Video</button>

          <!-- Direct YouTube embed -->
          <iframe
            src="https://www.youtube.com/embed/GA7RtIOBoSY?si=quY5RG7dFvx8RS5P"
            title="YouTube video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>

        </div>
      </div>
    </main>

    <aside aria-label="Sidebar">

      <h2>My Thread</h2>

      <nav class="site-nav" aria-label="Thread">
        <ul>
          <li><a href="#">Create Thread</a></li>
          <li><a href="#">Thread Name</a></li>
          <li><a href="#">Link Video</a></li>
          <li><a href="#">Save Thread</a></li>
        </ul>
      </nav>

    </aside>

  </div>

</body>
</html>
