<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidLink - Thread Creator</title>
</head>

<body>

    <main>
        <h1>VidLink - Create a Thread</h1>

        <!-- Thread name input -->
        <label for="thread-name">Thread Name</label>
        <input type="text" id="thread-name"
               placeholder="Enter thread name">

        <br><br>

        <!-- YouTube link input -->
        <label for="video-link">YouTube Link</label>
        <input type="url" id="video-link"
               placeholder="Enter YouTube URL">

        <button type="button" onclick="addVideo()">
            Add Link
        </button>

        <!-- List of added videos -->
        <h2>Videos in this Thread</h2>
        <ol id="video-list"></ol>

        <!-- Save and create thread buttons -->
        <button type="button" onclick="saveThread()">
            Save Thread
        </button>

        <button type="button" onclick="newThread()">
            New Thread
        </button>

        <p id="status" role="status"></p>

        <!-- Previously saved threads -->
        <h2>Saved Threads</h2>
        <ul id="saved-threads"></ul>
    </main>

    <script>

        let videos = [];
        let threads = [];
        let currentThread = null;

        // Extract the video ID from a YouTube link
        function getVideoId(link) {
            try {
                const url = new URL(link.trim());
                let videoId = null;

                if (url.protocol !== "https:" &&
                    url.protocol !== "http:") {
                    return null;
                }

                if (url.hostname === "youtu.be") {
                    videoId = url.pathname.split("/")[1];
                } else if (
                    ["youtube.com", "www.youtube.com",
                     "m.youtube.com"].includes(url.hostname)
                ) {
                    if (url.pathname === "/watch") {
                        videoId = url.searchParams.get("v");
                    } else if (
                        url.pathname.startsWith("/shorts/") ||
                        url.pathname.startsWith("/embed/")
                    ) {
                        videoId = url.pathname.split("/")[2];
                    }
                }

                if (/^[A-Za-z0-9_-]{11}$/.test(videoId || "")) {
                    return videoId;
                }

                return null;

            } catch {
                return null;
            }
        }

        // Add a video to the current thread
        function addVideo() {
            const input = document.getElementById("video-link");
            const videoId = getVideoId(input.value);

            if (!videoId) {
                showStatus("Please enter a valid YouTube link.");
                return false;
            }

            if (videos.includes(videoId)) {
                showStatus("This video has already been added.");
                return false;
            }

            videos.push(videoId);
            input.value = "";

            displayVideos();
            showStatus("Video added successfully.");
            return true;
        }

        // Display all added videos
        function displayVideos() {
            const list = document.getElementById("video-list");
            list.innerHTML = "";

            videos.forEach(function(videoId, index) {
                const item = document.createElement("li");

                const link = document.createElement("a");
                link.href = "https://www.youtube.com/watch?v=" + videoId;
                link.textContent = "Video " + (index + 1) + ": " + videoId;
                link.target = "_blank";
                link.rel = "noopener noreferrer";

                const removeButton = document.createElement("button");
                removeButton.textContent = "Remove";

                removeButton.onclick = function() {
                    videos.splice(index, 1);
                    displayVideos();
                };

                item.appendChild(link);
                item.appendChild(document.createTextNode(" "));
                item.appendChild(removeButton);
                list.appendChild(item);
            });
        }

        // Save the thread using browser local storage
        function saveThread() {
            const name = document.getElementById("thread-name")
                                 .value.trim();

            if (name === "") {
                showStatus("Please enter a thread name.");
                return;
            }

            const pendingLink = document.getElementById("video-link")
                                        .value.trim();

            if (pendingLink && !addVideo()) {
                return;
            }

            if (videos.length === 0) {
                showStatus("Please add at least one video.");
                return;
            }

            const thread = {
                name: name,
                videos: [...videos]
            };

            const updatedThreads = [...threads];

            let index = currentThread;

            if (index === null) {
                updatedThreads.push(thread);
                index = updatedThreads.length - 1;
            } else {
                updatedThreads[index] = thread;
            }

            try {
                localStorage.setItem(
                    "vidlinkThreads",
                    JSON.stringify(updatedThreads)
                );

                threads = updatedThreads;
                currentThread = index;

                displaySavedThreads();
                showStatus("Thread saved successfully.");

            } catch {
                showStatus("Unable to save the thread.");
            }
        }

        // Display previously saved threads
        function displaySavedThreads() {
            const list = document.getElementById("saved-threads");
            list.innerHTML = "";

            threads.forEach(function(thread, index) {
                const item = document.createElement("li");
                const button = document.createElement("button");

                button.textContent = thread.name;

                button.onclick = function() {
                    currentThread = index;

                    document.getElementById("thread-name").value =
                        thread.name;

                    document.getElementById("video-link").value = "";

                    videos = [...thread.videos];

                    displayVideos();
                    showStatus("Saved thread opened.");
                };

                item.appendChild(button);
                list.appendChild(item);
            });
        }

        // Start a new thread
        function newThread() {
            document.getElementById("thread-name").value = "";
            document.getElementById("video-link").value = "";

            videos = [];
            currentThread = null;

            displayVideos();
            showStatus("New thread created.");
        }

        // Display feedback to the user
        function showStatus(message) {
            document.getElementById("status").textContent = message;
        }

        // Retrieve saved threads when the page loads
        try {
            const saved = JSON.parse(
                localStorage.getItem("vidlinkThreads") || "[]"
            );

            if (Array.isArray(saved)) {
                threads = saved.filter(function(thread) {
                    return thread &&
                        typeof thread.name === "string" &&
                        Array.isArray(thread.videos) &&
                        thread.videos.every(function(id) {
                            return typeof id === "string" &&
                                /^[A-Za-z0-9_-]{11}$/.test(id);
                        });
                });
            }

            displaySavedThreads();

        } catch {
            showStatus("Unable to load saved threads.");
        }

    </script>

</body>
</html>
